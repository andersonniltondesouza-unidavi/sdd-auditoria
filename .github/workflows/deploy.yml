name: CI/CD Pipeline - Segurança e Deploy na EC2

on:
  push:
    branches:
      - main

jobs:
  # ---------------------------------------------------
  # JOB 1: SCANNER DE SEGURANÇA
  # ---------------------------------------------------
  security_scan:
    name: Scanner de Segurança (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Escanear código com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # ---------------------------------------------------
  # JOB 2: DEPLOY NA INSTÂNCIA EC2 (NGINX)
  # ---------------------------------------------------
  deploy:
    name: Deploy na EC2
    needs: security_scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Copiar arquivos temporariamente (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/site"
          rm: true 

      - name: Mover para o Nginx e Reiniciar (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo cp -r /home/ubuntu/site/* /var/www/html/
            sudo systemctl restart nginx
            echo "Deploy estático finalizado com sucesso!"