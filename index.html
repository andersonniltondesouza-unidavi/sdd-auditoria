<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Kanban</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema Kanban</h1>
            <form id="task-form">
                <input type="text" id="task-title" placeholder="Título da Tarefa" required>
                <textarea id="task-desc" placeholder="Adicione uma observação..." rows="2" required></textarea>
                <button type="submit">Cadastrar Tarefa</button>
            </form>
        </header>

        <main class="kanban-board">
            <section class="kanban-column" data-status="aberto">
                <div class="column-header">
                    <h2>Em Aberto</h2>
                </div>
                <div class="task-list"></div>
            </section>

            <section class="kanban-column" data-status="andamento">
                <div class="column-header">
                    <h2>Em Andamento</h2>
                </div>
                <div class="task-list"></div>
            </section>

            <section class="kanban-column" data-status="finalizado">
                <div class="column-header">
                    <h2>Finalizado</h2>
                </div>
                <div class="task-list"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
